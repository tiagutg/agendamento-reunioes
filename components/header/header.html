<!DOCTYPE html>
<html lang="pt-BR">

 <html>
    <head>
        <link rel="stylesheet" href="components/header/header.css">
        <link rel="stylesheet" href="components/sidebar/sidebar.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
   <body>
   
   <!-- ================================================================
         HEADER — BARRA SUPERIOR FIXA
         Componente externo — não alterado.
         ================================================================ -->

    <header>

        <div class="header-left">
            <div class="menu-icon" id="menuToggle">☰</div>
            <div class="logo">
                <img src="img/logoUniSales.png" alt="Logo UniSales">
            </div>
        </div>

        <div class="header-right">

            <!-- Sino de notificações -->
            <div class="notification-wrapper">

                <i class="fa-regular fa-bell" id="notificationBell"></i>
                <span class="notification-dot"></span>

                <div class="notification-dropdown" id="notificationDropdown">

                    <div class="notification-header">
                        <strong>Notificações</strong>
                        <span id="markAllRead">Marcar tudo como lido</span>
                    </div>

                    <!-- Notificação 1 -->
                    <div
                        class="dropdown-item"
                        data-title="Reunião confirmada"
                        data-description="Sua reunião foi confirmada com sucesso."
                        data-professor="João Silva"
                        data-date="14/05/2026"
                        data-time="19:30"
                        data-status="Confirmada"
                    >
                        <div class="mail-icon">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <div>
                            <h4>Você tem uma nova mensagem</h4>
                            <p>REUNIÃO CONFIRMADA</p>
                            <small>Hoje - 14:30</small>
                        </div>
                        <span class="item-dot"></span>
                    </div>

                    <!-- Notificação 2 -->
                    <div
                        class="dropdown-item"
                        data-title="Lembrete de reunião"
                        data-description="Sua reunião começa em 30 minutos."
                        data-professor="João Silva"
                        data-date="14/05/2026"
                        data-time="18:00"
                        data-status="Em breve"
                    >
                        <div class="mail-icon">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <div>
                            <h4>Lembrete de reunião</h4>
                            <p>Sua reunião começa em 30 minutos</p>
                            <small>Hoje - 18:00</small>
                        </div>
                        <span class="item-dot"></span>
                    </div>

                </div>
                <!-- fim .notification-dropdown -->

            </div>
            <!-- fim .notification-wrapper -->

            <div>▦</div>

            <!-- Avatar e dropdown de conta -->
            <div class="account-wrapper">

                <div class="avatar" id="accountButton">TA</div>

                <div class="account-dropdown" id="accountDropdown">

                    <div class="account-header">
                        <h3>TIAGO LOPES ALVES</h3>
                        <p>Ambiente: UNISALES (Graduação)</p>
                        <span>Estudante</span>
                    </div>

                    <div class="account-item">
                        <i class="fa-regular fa-circle-user"></i>
                        <span>Minha conta</span>
                    </div>

                    <div class="account-item">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Sair</span>
                    </div>

                </div>

            </div>
            <!-- fim .account-wrapper -->

        </div>
        <!-- fim .header-right -->

    </header>

    <script src="components/header/account.js"></script>
    <script src="components/header/notifications.js"></script>
    <script src="components/sidebar/sidebar.js"></script>

    <body>
    <html>
